[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lap-bell"
version = "0.1.0"
description = "Terminal timer and stopwatch that sends a desktop notification when time is up"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "landry-some" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lapbell = "lap_bell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
